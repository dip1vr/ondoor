name: ondoor
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  device_preview: ^1.3.1
  get: ^4.7.2
  flutter_feather_icons: ^2.0.0+1
  google_fonts: ^6.3.1
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  google_maps_flutter: ^2.12.3
  location: ^8.0.1
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  google_maps_flutter_web: ^0.5.14+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/cat.png
    - lib/assets/noorder_ass.png
    - lib/assets/order.png
    - lib/assets/earning_ass.png
    - assets/map_style.json

